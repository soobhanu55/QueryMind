# Free-tier Supabase pauses a project after 7 days without activity, which broke the live demo.
# One trivial read every 3 days keeps it awake. Needs repo secret SUPABASE_DB_URL (postgresql://... sync URL).
name: db-keepalive
on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: psql "$SUPABASE_DB_URL" -c "SELECT count(*) FROM customers;"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
